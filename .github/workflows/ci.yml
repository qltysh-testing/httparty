name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set at the job level so the coverage step's `if` can check for its presence.
      # Not available on pull requests from forks, where the upload is skipped.
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
    strategy:
      matrix:
        ruby:
          - 2.7
          - "3.0" # Quoted, to avoid YAML float 3.0 interplated to "3"
          - 3.1
          - 3.2
          - 3.3
          - 3.4
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # Run "bundle install", and cache the result automatically.
      - name: Run Rake
        run: bundle exec rake
      # SimpleCov (started in spec/spec_helper.rb) writes coverage/.resultset.json
      # during the rspec task. Publish it from a single representative Ruby
      # version, since every matrix leg exercises the same suite and code.
      - name: Upload coverage to Qlty
        if: ${{ matrix.ruby == 3.4 && env.QLTY_COVERAGE_TOKEN != '' }}
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/.resultset.json
          format: simplecov
